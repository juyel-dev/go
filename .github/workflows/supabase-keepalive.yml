name: Supabase Keepalive

# Supabase free-tier projects pause after 7 days without API activity --
# docs/ARCHITECTURE.md §6, DATABASE.md §6. This runs daily so "go" never
# pauses, at zero cost.
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily -- arbitrary off-peak minute
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/workspaces?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
