name: Debug Tail (temporary)

on:
  workflow_dispatch: {}

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect multiple routes directly
        run: |
          for path in "/" "/link-not-found" "/link-expired" "/bMjLTUC" "/login"; do
            code=$(curl -s -o /tmp/r.html -w "%{http_code}" "https://shrtly.myself-juyel-dev.workers.dev${path}")
            h1=$(grep -o '<h1[^>]*>[^<]*</h1>' /tmp/r.html | head -1)
            echo "::notice::PATH=${path} STATUS=${code} H1=${h1}"
          done
          echo "::notice::current deployment version check"
          curl -s -o /dev/null -D /tmp/headers.txt "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          echo "::notice::headers: $(cat /tmp/headers.txt | tr '\n' ' | ')"
