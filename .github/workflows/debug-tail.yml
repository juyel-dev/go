name: Debug Tail (temporary)

on:
  workflow_dispatch: {}

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install wrangler
      - name: Tail worker logs while triggering test requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail shrtly --format json > tail.ndjson 2> tail-stderr.log &
          TAIL_PID=$!
          sleep 6
          curl -s -o /dev/null "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 2
          curl -s -o /dev/null "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 6
          kill $TAIL_PID 2>/dev/null || true
          sleep 2
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          COUNT=$(wc -l < tail.ndjson || echo 0)
          echo "::notice::captured $COUNT log lines, tail-stderr: $(cat tail-stderr.log | tr '\n' ' ' | cut -c1-300)"
          jq -c '.exceptions[]?' tail.ndjson | while read -r line; do
            echo "::error::EXCEPTION $line"
          done
          jq -c '.logs[]?' tail.ndjson | while read -r line; do
            echo "::warning::LOG $line"
          done
          jq -c '{outcome, url: .event.request.url}' tail.ndjson | while read -r line; do
            echo "::notice::EVENT $line"
          done
