name: Debug Tail (temporary)

on:
  workflow_dispatch: {}

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repeated isolated tests
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/r$i.html -w "%{http_code}" -D /tmp/h$i.txt "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC")
            loc=$(grep -i "^location:" /tmp/h$i.txt | tr -d '\r')
            h1=$(grep -o '<h1[^>]*>[^<]*</h1>' /tmp/r$i.html | head -1)
            echo "::notice::ATTEMPT_$i STATUS=$code LOCATION=$loc H1=$h1"
            sleep 1
          done
