name: Supabase Keepalive

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/public_link_resolution?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Keepalive ping succeeded. Status: $status"
            exit 0
          else
            echo "::error::Keepalive failed. HTTP status: $status | URL_SET=${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }} | KEY_SET=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }} | Body: $body"
            exit 1
          fi
