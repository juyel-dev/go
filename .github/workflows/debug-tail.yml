name: Debug Tail (temporary)

on:
  workflow_dispatch: {}

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install wrangler
      - name: Tail worker logs while triggering test requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail shrtly --format json > tail.ndjson 2>tail-stderr.log &
          TAIL_PID=$!
          sleep 6
          echo "Triggering test requests..."
          curl -s -o /dev/null -w "req1 status: %{http_code}\n" "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 2
          curl -s -o /dev/null -w "req2 status: %{http_code}\n" "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 6
          kill $TAIL_PID 2>/dev/null || true
          sleep 2
          echo "--- tail-stderr.log ---"
          cat tail-stderr.log || true
          echo "--- tail.ndjson line count ---"
          wc -l tail.ndjson || true
          echo "--- extracted logs/exceptions ---"
          python3 -c "
import json
try:
    with open('tail.ndjson') as f:
        lines = [l for l in f if l.strip()]
    print(f'Captured {len(lines)} events')
    for line in lines:
        try:
            evt = json.loads(line)
        except Exception:
            continue
        outcome = evt.get('outcome')
        exceptions = evt.get('exceptions', [])
        logs = evt.get('logs', [])
        url = evt.get('event', {}).get('request', {}).get('url', '')
        print(f'::notice::URL={url} outcome={outcome}')
        for exc in exceptions:
            print(f'::error::EXCEPTION: {exc.get(\"name\")}: {exc.get(\"message\")}')
        for lg in logs:
            msg = ' '.join(str(m) for m in lg.get('message', []))
            print(f'::warning::LOG[{lg.get(\"level\")}]: {msg[:500]}')
except FileNotFoundError:
    print('::error::tail.ndjson not found')
"
