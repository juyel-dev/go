name: Supabase Keepalive

# Supabase free-tier projects pause after 7 days without API activity --
# docs/ARCHITECTURE.md §6, DATABASE.md §6. This runs daily so "go" never
# pauses, at zero cost. Targets `public_link_resolution` (explicit anon
# grant, see docs/DATABASE.md §5) rather than a raw table, to sidestep any
# RLS-vs-grant ambiguity on tables like `workspaces`.
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily -- arbitrary off-peak minute
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/public_link_resolution?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "HTTP status: $status"
          echo "Response body: $body"
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Keepalive ping succeeded."
            exit 0
          else
            echo "Keepalive ping failed."
            exit 1
          fi
