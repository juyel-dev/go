name: Debug Tail (temporary)

on:
  workflow_dispatch: {}

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install wrangler
      - name: Tail worker logs while triggering test requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler tail shrtly --format json > tail.ndjson 2> tail-stderr.log &
          TAIL_PID=$!
          sleep 6
          echo "Triggering test requests..."
          curl -s -o /dev/null -w "req1 status: %{http_code}\n" "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 2
          curl -s -o /dev/null -w "req2 status: %{http_code}\n" "https://shrtly.myself-juyel-dev.workers.dev/bMjLTUC"
          sleep 6
          kill $TAIL_PID 2>/dev/null || true
          sleep 2
          echo "stderr:"
          cat tail-stderr.log || true
          echo "line count:"
          wc -l tail.ndjson || true
          echo "raw content follows"
          cat tail.ndjson || true
      - name: Extract findings
        if: always()
        run: |
          pip install --quiet --break-system-packages jq 2>/dev/null || true
          sudo apt-get install -y jq >/dev/null 2>&1 || true
          echo "outcomes:"
          jq -r '"outcome=" + (.outcome // "null") + " url=" + (.event.request.url // "null")' tail.ndjson || true
          echo "exceptions:"
          jq -r '.exceptions[]? | "EXCEPTION: " + .name + ": " + .message' tail.ndjson || true
          echo "logs:"
          jq -r '.logs[]? | "LOG[" + .level + "]: " + (.message | tostring)' tail.ndjson || true
